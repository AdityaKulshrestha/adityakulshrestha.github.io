<a class="row" href="{{ .RelPermalink }}">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
  <div>
    <h3>{{ .Title }}</h3>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
    <div class="meta">
      <span>{{ .ReadingTime }} min read</span>
      {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
    </div>
  </div>
</a>
