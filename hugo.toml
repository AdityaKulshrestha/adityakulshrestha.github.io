baseURL = 'https://adityakulshrestha.github.io/'
languageCode = 'en-us'
title = 'Aditya Kulshrestha'
disableKinds = ['taxonomy']

[params]
  name = 'Aditya Kulshrestha'
  role = 'AI Engineer'
  focus = ['Model Performance & Optimization', 'Hardware Software Codesign', 'Infra and Systems', 'Inference', 'Model Training', 'ASR', 'TTS', 'Voice Agents']
  description = 'Notes and write-ups on model performance, hardware-software codesign, and infra and systems.'
  photo = '/assets/pp.png'

  [[params.socials]]
    name = 'LinkedIn'
    url = 'https://www.linkedin.com/in/adityakulshrestha02/'
  [[params.socials]]
    name = 'GitHub'
    url = 'https://github.com/adityakulshrestha'
  [[params.socials]]
    name = 'X'
    url = 'https://x.com/Aditya_kul02'
  [[params.socials]]
    name = 'Resume'
    url = 'https://drive.google.com/file/d/1ibzWy5g3G9uuynhhz4apQzzxow59OvG0/view?usp=drive_link'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 20

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\[', '\]']]
      inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    noClasses = true
    style = 'github'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
